<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1000" width="800" height="1000">
  <defs>
    <style>
      .bg { fill: #E8DCC2; }
      .sun { fill: #E9A23B; opacity: 0.25; }
      .figure { fill: #1C2733; opacity: 0.12; }
      .border-line { stroke: #8A4B0F; stroke-width: 2; stroke-dasharray: 8 8; fill: none; opacity: 0.6; }
      .title { font-family: 'Fraunces', Georgia, serif; font-size: 28px; font-weight: 600; fill: #1C2733; text-anchor: middle; }
      .subtitle { font-family: 'Figtree', system-ui, sans-serif; font-size: 16px; font-weight: 500; fill: #8A4B0F; text-anchor: middle; }
      .instruction { font-family: 'Figtree', system-ui, sans-serif; font-size: 14px; fill: #1C2733; opacity: 0.7; text-anchor: middle; }
    </style>
  </defs>
  <rect width="800" height="1000" class="bg"/>
  <circle cx="400" cy="420" r="260" class="sun"/>
  
  <!-- Stylized portrait silhouette placeholder -->
  <circle cx="400" cy="380" r="110" class="figure"/>
  <path d="M 220 720 C 220 540, 580 540, 580 720 Z" class="figure"/>

  <!-- Border & Placeholder Tag -->
  <rect x="40" y="40" width="720" height="920" rx="8" class="border-line"/>
  
  <rect x="250" y="770" width="300" height="110" rx="6" fill="#F5EEDD" stroke="#E9A23B" stroke-width="1.5"/>
  <text x="400" y="805" class="title">Portrait Slot</text>
  <text x="400" y="835" class="subtitle">Sunday Ojima Onalo (4:5)</text>
  <text x="400" y="860" class="instruction">Replace with author photography</text>
</svg>
